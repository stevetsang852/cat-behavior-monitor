mqtt:
  enabled: false

detectors:
  cpu1:
    type: cpu
    num_threads: 2

objects:
  track:
    - cat

cameras:
  cat_food_demo:
    ffmpeg:
      inputs:
        - path: /media/frigate/cat_eating.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    zones:
      food_zone:
        coordinates: 0.3,0.4,0.7,0.4,0.7,0.9,0.3,0.9
        objects:
          - cat
    record:
      enabled: true
      retain:
        days: 1
        mode: active_objects
    snapshots:
      enabled: true

  cat_litter_demo:
    ffmpeg:
      inputs:
        - path: /media/frigate/cat_litter.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    zones:
      litter_zone:
        coordinates: 0.2,0.5,0.8,0.5,0.8,0.95,0.2,0.95
        objects:
          - cat
    record:
      enabled: true
      retain:
        days: 1
        mode: active_objects
    snapshots:
      enabled: true
